<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eproexpo - Admin Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom checkbox style to match the green square with check */
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid #d1d5db;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            transform-origin: bottom left;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
        }

        .custom-checkbox:checked {
            background-color: #10B981; /* Emerald 500 */
            border-color: #10B981;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen bg-white">
    <div class="flex min-h-screen flex-col lg:flex-row">
        
        <!-- Left Side: Illustration Area (Hidden on mobile) -->
        <div class="hidden lg:flex lg:w-1/2 bg-[#f8f7fc] items-center justify-center relative overflow-hidden p-12">
            <!-- Include the 3D illustration generated -->
            <img src="illustration.png" alt="Secure Server Dashboard" class="w-full max-w-2xl h-auto object-contain relative z-10 drop-shadow-2xl" />
        </div>

        <!-- Right Side: Login Form -->
        <div class="w-full lg:w-1/2 flex flex-col px-8 sm:px-16 lg:px-24 xl:px-32 py-12">
            
            <div class="flex flex-col h-full justify-center max-w-[440px] w-full mx-auto relative">
                
                <!-- Main Form Content -->
                <div class="flex-1 flex flex-col justify-center mt-12 mb-12">
                    
                    <!-- Logo -->
                    <div class="flex items-center gap-4 mb-12">
                        <svg viewBox="0 0 100 100" class="w-[64px] h-[64px] shrink-0 drop-shadow-lg" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGradLarge" x1="0%" y1="100%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#1060FF"/>
                                    <stop offset="35%" stop-color="#00D4FF"/>
                                    <stop offset="65%" stop-color="#FF3B6A"/>
                                    <stop offset="100%" stop-color="#FF7547"/>
                                </linearGradient>
                            </defs>
                            <path d="M 80 50 L 20 50 A 30 30 0 0 1 80 50 A 30 30 0 0 1 65 76" stroke="url(#logoGradLarge)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                        </svg>
                        <span class="text-[#173bf2] text-[44px] font-bold tracking-tight">eproexpo</span>
                    </div>

                    <!-- Headings -->
                    <h1 class="text-[34px] font-bold text-[#1a1c29] mb-3">Welcome Back, Admin</h1>
                    <p class="text-[#64748B] text-[17px] mb-12 font-medium">Sign in to your admin dashboard</p>

                    <!-- Form -->
                    <form action="#" method="POST" class="space-y-6">
                        
                        <!-- Email -->
                        <div class="space-y-2.5">
                            <label for="email" class="block text-[15px] font-semibold text-[#1a1c29]">Email Address</label>
                            <input type="email" name="email" id="email" class="w-full px-4 py-3.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#3723db] focus:border-transparent transition-all text-[15px] text-gray-800" value="admin@eproexpo.com" placeholder="Enter your email">
                        </div>

                        <!-- Password -->
                        <div class="space-y-2.5">
                            <label for="password" class="block text-[15px] font-semibold text-[#1a1c29]">Password</label>
                            <div class="relative">
                                <input type="password" name="password" id="password" class="w-full px-4 py-3.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#3723db] focus:border-transparent transition-all text-[15px] text-gray-800 tracking-[0.2em]" value="password123" placeholder="Enter your password">
                                <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                                    <i class="ph ph-eye text-xl"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center justify-between pt-1">
                            <div class="flex items-center">
                                <input id="remember-me" name="remember-me" type="checkbox" class="custom-checkbox cursor-pointer" checked>
                                <label for="remember-me" class="ml-2.5 block text-[15px] font-medium text-[#475569] cursor-pointer select-none">
                                    Remember me
                                </label>
                            </div>
                            
                            <div class="text-[15px]">
                                <a href="#" class="font-medium text-[#3723db] hover:text-[#2515a6] transition-colors">
                                    Forgot Password?
                                </a>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-5">
                            <button type="button" onclick="window.location.href='admin_dashboard.html'" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-[10px] shadow-md text-[16px] font-semibold text-white bg-[#3723db] hover:bg-[#2515a6] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#3723db] transition-all transform active:scale-[0.98]">
                                Login
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Footer -->
                <div class="text-[#64748B] text-[14px] font-medium mt-auto pb-4">
                    &copy; 2024 EproExpo. All rights reserved.
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
