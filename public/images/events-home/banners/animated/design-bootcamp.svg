<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">Design Bootcamp animated banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity="0.35">
    <circle cx="120" cy="80" r="48" fill="#f0abfc">
      <animate attributeName="cx" values="120;140;120" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="280" r="64" fill="#fda4af">
      <animate attributeName="cy" values="280;260;280" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="90" r="28" fill="#c4b5fd">
      <animate attributeName="r" values="22;34;22" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(210 62)">
    <rect x="0" y="0" width="220" height="236" rx="24" fill="#ffffff" opacity="0.95"/>
    <rect x="24" y="28" width="172" height="112" rx="16" fill="#ede9fe"/>
    <rect x="24" y="156" width="110" height="12" rx="6" fill="#a78bfa">
      <animate attributeName="width" values="70;110;70" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="180" width="148" height="12" rx="6" fill="#c4b5fd"/>
    <circle cx="176" cy="204" r="18" fill="#7c3aed">
      <animate attributeName="r" values="14;20;14" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#fdf4ff" stroke-width="3" fill="none" opacity="0.5">
    <path d="M40 300 C120 240, 200 320, 280 260">
      <animate attributeName="stroke-dashoffset" values="0;80;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="10 8" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
