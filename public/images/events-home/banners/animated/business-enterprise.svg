<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">Business Enterprise animated banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g fill="#93c5fd" opacity="0.18">
    <rect x="40" y="220" width="56" height="100" rx="6">
      <animate attributeName="height" values="80;120;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="240;200;240" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="190" width="56" height="130" rx="6">
      <animate attributeName="height" values="110;150;110" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="210;170;210" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="160" width="56" height="160" rx="6">
      <animate attributeName="height" values="130;180;130" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="190;140;190" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="180" width="56" height="140" rx="6">
      <animate attributeName="height" values="120;160;120" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="210" width="56" height="110" rx="6">
      <animate attributeName="height" values="90;130;90" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(286 88)">
    <rect x="0" y="0" width="68" height="170" rx="10" fill="#1e3a8a"/>
    <rect x="10" y="14" width="48" height="36" rx="6" fill="#60a5fa">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="62" width="48" height="36" rx="6" fill="#3b82f6"/>
    <rect x="10" y="110" width="48" height="36" rx="6" fill="#2563eb"/>
  </g>
  <path d="M0 280 Q320 240 640 280" stroke="#bfdbfe" stroke-width="3" fill="none" opacity="0.35">
    <animate attributeName="d" values="M0 280 Q320 240 640 280;M0 280 Q320 260 640 280;M0 280 Q320 240 640 280" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
